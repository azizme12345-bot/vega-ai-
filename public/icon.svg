<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle pulse ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2" />

  <!-- Core AI Star / Sparkle Shape -->
  <g filter="url(#glow)">
    <path d="M 256 120 
             C 256 195 275 214 350 214 
             C 275 214 256 233 256 308 
             C 256 233 237 214 162 214 
             C 237 214 256 195 256 120 Z" 
          fill="url(#glowGrad)" />

    <!-- Secondary small sparkle top right -->
    <path d="M 370 140 
             C 370 165 378 173 403 173 
             C 378 173 370 181 370 206 
             C 370 181 362 173 337 173 
             C 362 173 370 165 370 140 Z" 
          fill="#93c5fd" />

    <!-- Voice Soundwave bars at bottom -->
    <rect x="196" y="340" width="16" height="42" rx="8" fill="url(#glowGrad)" />
    <rect x="226" y="324" width="16" height="74" rx="8" fill="url(#glowGrad)" />
    <rect x="256" y="312" width="16" height="98" rx="8" fill="#ffffff" />
    <rect x="286" y="324" width="16" height="74" rx="8" fill="url(#glowGrad)" />
    <rect x="316" y="340" width="16" height="42" rx="8" fill="url(#glowGrad)" />
  </g>
</svg>
